# Alembic configuration file
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use for generating timestamps
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to "true" to run the environment during the "init" command
# revision_environment = false

# Set to "true" to allow .pyc and .pyo files without a source .py file to be
# detected as revisions in the versions/ directory
# sourceless = false

# Version location specification; This defaults to alembic/versions.
# Leave commented out unless using multiple version directories.
# version_locations = %(here)s/bar:%(here)s/foo:%(here)s/alembic/versions

# Version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new alembic.ini files is "os", which uses
# os.pathsep. Note that this key is only used when version_locations is set.
# version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.
# version_path_separator = ;   # Windows pathsep

# Output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

# The database URL is injected at runtime from app.core.config.settings
# so this placeholder is intentionally left as-is.
sqlalchemy.url = driver://user:pass@localhost/dbname


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
